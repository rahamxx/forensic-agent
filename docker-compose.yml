version: '3.8'

services:
  forensic-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forensic-investigation-agent
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - VT_API_KEY=${VT_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/agent/scenarios"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
